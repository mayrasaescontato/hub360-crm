name: Patch Alliance opportunity origin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-opportunity-origin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch opportunity card
        run: python3 scripts/patch_opportunity_origin.py
      - name: Validate
        run: |
          grep -q "Origem:" index.html
          grep -q "c.origin" index.html
      - name: Commit CRM update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Hub360 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Show lead origin on Alliance opportunity cards'
          git push
