name: Add QR Leads page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-qr-leads-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CRM
        shell: bash
        env:
          PATCH_B64: "  i5uYW1lLHIucGhvbmUsc i5lbWFpbCxyLnN0dWRlbnRfbmFtZSxyLnN0dWRlbnRfYWdlLHIuZXhwZXJpZW5jZV9sZXZlbCxyLm1lc3NhZ2Usc "
        run: |
          echo "$PATCH_B64" | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Validate
        shell: bash
        run: |
          grep -q 'page-qrcode' index.html
          grep -q 'qr_code_leads?select=' index.html
          grep -q 'QR Code Ônibus' index.html
      - name: Commit CRM update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Hub360 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add QR Code bus leads page to Alliance CRM'
          git push
