<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abrindo SMS...</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a2e27;
    color: #F5F0E8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #22392f;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin-bottom: 8px; color: #C4A97D; }
  p { font-size: 15px; color: #cfc9bd; margin-bottom: 24px; line-height: 1.5; }
  .phone { font-weight: 600; color: #F5F0E8; }
  .btn {
    display: inline-block;
    background: #C4A97D;
    color: #1a2e27;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 16px;
    width: 100%;
  }
  .error {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    font-size: 14px;
    text-align: left;
  }
  .error.show { display: block; }
  .error strong { color: #C4A97D; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">💬</div>
    <h1 id="titleText">Carregando...</h1>
    <p id="subtitleText">Buscando dados do aluno</p>
    <a href="#" class="btn" id="smsLink" style="display:none">Abrir SMS agora</a>

    <div class="error" id="errorBox">
      <p style="margin-bottom:8px;"><strong>Não abriu automaticamente?</strong></p>
      <p style="margin-bottom:4px;">Número: <span id="phoneManual"></span></p>
      <p style="margin-bottom:0;">Copie o número acima e cole no app de Mensagens do seu celular.</p>
    </div>
  </div>

<script>
  const SUPA_URL = 'https://mvktoymgeapkpsvfmbfl.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12a3RveW1nZWFwa3BzdmZtYmZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMjA4NTEsImV4cCI6MjA5NDc5Njg1MX0._RQsWc2jR4kSuALw5jHl7T2Q-bgjvDrSQdmjwCD8dWA';

  function getParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name) || '';
  }

  function buildSmsUri(phone, body) {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const encodedBody = encodeURIComponent(body);
    if (isIOS) {
      return body ? `sms:${phone}&body=${encodedBody}` : `sms:${phone}`;
    } else {
      return body ? `sms:${phone}?body=${encodedBody}` : `sms:${phone}`;
    }
  }

  function showFallback(phone) {
    document.getElementById('phoneManual').textContent = phone || '(número não informado)';
    document.getElementById('errorBox').classList.add('show');
  }

  function formatTrialDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const month = months[d.getMonth()];
    const day = d.getDate();
    const year = d.getFullYear();
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2,'0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    if (hours === 0) hours = 12;
    return `${month} ${day}, ${year} at ${hours}:${minutes} ${ampm}`;
  }

  function goToSms(phone, body) {
    document.getElementById('titleText').textContent = 'Abrindo Mensagens...';
    document.getElementById('subtitleText').innerHTML = `Enviando SMS para <span class="phone">${phone}</span>`;
    const smsUri = buildSmsUri(phone, body);
    const link = document.getElementById('smsLink');
    link.href = smsUri;
    link.style.display = 'inline-block';
    window.location.href = smsUri;
    setTimeout(function() { showFallback(phone); }, 1500);
  }

  async function init() {
    const id = getParam('id');

    if (id) {
      try {
        const res = await fetch(`${SUPA_URL}/rest/v1/opportunities?id=eq.${encodeURIComponent(id)}&select=contact,phone,trial_date`, {
          headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
        });
        if (!res.ok) throw new Error('Falha ao buscar lead');
        const rows = await res.json();
        if (!rows.length) throw new Error('Lead não encontrado');
        const lead = rows[0];
        const phone = (lead.phone || '').trim();
        if (!phone) throw new Error('Lead sem telefone cadastrado');

        const dataFormatada = formatTrialDate(lead.trial_date);
        const body = `Hi ${lead.contact}!\n\nThis is Saul, from Alliance Jiu-Jitsu Framingham 🥋\n\nWe received your sign-up for the FREE trial class${dataFormatada ? ', scheduled for ' + dataFormatada : ''}.\n\nPlease reply:\n1 - I confirm ✅\n2 - I need to reschedule 📅\n\nWe look forward to hearing from you!`;

        goToSms(phone, body);
      } catch (e) {
        document.getElementById('titleText').textContent = 'Não foi possível carregar';
        document.getElementById('subtitleText').textContent = e.message || 'Tente novamente em instantes.';
        showFallback('');
      }
      return;
    }

    const phone = getParam('to').trim();
    const body = getParam('body').trim();
    if (phone) {
      goToSms(phone, body);
    } else {
      document.getElementById('titleText').textContent = 'Link inválido';
      document.getElementById('subtitleText').textContent = 'Nenhum aluno informado.';
      showFallback('');
    }
  }

  init();
</script>
</body>
</html>
