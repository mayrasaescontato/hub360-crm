<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abrindo SMS...</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a2e27;
    color: #F5F0E8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #22392f;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin-bottom: 8px; color: #C4A97D; }
  p { font-size: 15px; color: #cfc9bd; margin-bottom: 24px; line-height: 1.5; }
  .phone { font-weight: 600; color: #F5F0E8; }
  .btn {
    display: inline-block;
    background: #C4A97D;
    color: #1a2e27;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 16px;
    width: 100%;
  }
  .error {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    font-size: 14px;
    text-align: left;
  }
  .error.show { display: block; }
  .error strong { color: #C4A97D; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">💬</div>
    <h1>Abrindo Mensagens...</h1>
    <p>Enviando SMS para <span class="phone" id="phoneDisplay"></span></p>
    <a href="#" class="btn" id="smsLink">Abrir SMS agora</a>

    <div class="error" id="errorBox">
      <p style="margin-bottom:8px;"><strong>Não abriu automaticamente?</strong></p>
      <p style="margin-bottom:4px;">Número: <span id="phoneManual"></span></p>
      <p style="margin-bottom:0;">Copie o número acima e cole no app de Mensagens do seu celular.</p>
    </div>
  </div>

<script>
  function getParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name) || '';
  }

  const phone = getParam('to').trim();
  const body = getParam('body').trim();

  document.getElementById('phoneDisplay').textContent = phone || '(número não informado)';
  document.getElementById('phoneManual').textContent = phone || '(número não informado)';

  function buildSmsUri(phone, body) {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const encodedBody = encodeURIComponent(body);

    if (isIOS) {
      // iOS usa "&" antes do body
      return body ? `sms:${phone}&body=${encodedBody}` : `sms:${phone}`;
    } else {
      // Android usa "?" antes do body
      return body ? `sms:${phone}?body=${encodedBody}` : `sms:${phone}`;
    }
  }

  if (phone) {
    const smsUri = buildSmsUri(phone, body);
    const link = document.getElementById('smsLink');
    link.href = smsUri;

    // Tenta abrir automaticamente
    window.location.href = smsUri;

    // Se depois de 1.5s ainda estiver na página, mostra fallback
    setTimeout(function() {
      document.getElementById('errorBox').classList.add('show');
    }, 1500);
  } else {
    document.getElementById('smsLink').style.display = 'none';
    document.getElementById('errorBox').classList.add('show');
  }
</script>
</body>
</html>
